<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Football Transfer Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="admin-login-page">

        <div class="admin-login-box">

            <h1>Admin Login</h1>

            <p>Login to manage football transfers.</p>

            <form id="loginForm">

                <div>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter admin email"
                        required
                    >
                </div>

                <div>
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter admin password"
                        required
                    >
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

        </div>

    </main>

    <script src="admin-login.js"></script>

</body>
</html>
